query findIeObjectsForSitemap($licenses: [String!]!, $offset: Int!, $limit: Int) {
	graph_intellectual_entity(
		where: {
			schemaLicenses: { schema_license: { _in: $licenses } }
			dctermsFormat: { dcterms_format: { _neq: "newspaperpage" } }
		}
		offset: $offset
		limit: $limit
	) {
		schema_identifier
		updated_at
		schemaNames(where: { is_ai_generated: { _eq: false } }) {
			schema_name
			is_ai_generated
		}
		schemaMaintainer {
			org_identifier
			skos_pref_label
		}
	}
}
