query getVideoFileByRepresentationId($representationId: String) {
	graph_includes(
		where: {
			representation_id: { _eq: $representationId }
			file: {
				ebucore_has_mime_type: {
					_in: [
						"video/mp4"
						"application/mp4"
						"video/ogv"
						"video/webm"
						"video/m3u8"
						"application/vnd.apple.mpegurl"
					]
				}
			}
		}
		limit: 1
	) {
		file {
			id
			premis_stored_at
		}
	}
}
