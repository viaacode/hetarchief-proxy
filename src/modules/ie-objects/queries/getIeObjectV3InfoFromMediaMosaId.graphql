query getIeObjectV3InfoFromMediaMosaId($mediaMosaId: String) {
	nvdgo_mediamosa_assets(where: { asset_id: { _eq: $mediaMosaId } }) {
		ieObject {
			schemaMaintainer {
				organizationSlug {
					slug
				}
			}
			schemaNames(where: { is_ai_generated: { _eq: false } }) {
				schema_name
				is_ai_generated
			}
			schema_identifier
		}
	}
}
