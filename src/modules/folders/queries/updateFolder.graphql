mutation updateFolder(
	$folderId: uuid!
	$folderOwnerWhere: users_folder_bool_exp!
	$folder: users_folder_set_input
) {
	update_users_folder(
		where: { _and: [{ id: { _eq: $folderId } }, $folderOwnerWhere] }
		_set: $folder
	) {
		returning {
			id
			name
			description
			user_profile_id
			owner_organisation_id
			is_default
			created_at
			updated_at
		}
	}
}
