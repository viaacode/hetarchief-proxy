query getIeObjectsInTheme($slug: String!, $objectsLimit: Int!) {
	app_theme(where: { slug: { _eq: $slug } }) {
		id
		slug
		name_nl
		name_en
		image_url
		ieObjectLinksRandomOrder(limit: $objectsLimit) {
			ieObject {
				id
				schema_identifier
				schemaNames(where: { is_ai_generated: { _eq: false } }) {
					schema_name
					is_ai_generated
				}
				dctermsFormat {
					dcterms_format
				}
				schemaThumbnail {
					schema_thumbnail_url
				}
				schemaMaintainer {
					id
					skos_pref_label
					ha_org_sector
					org_identifier
				}
				schemaLicense {
					schema_license
				}
			}
		}
	}
}
